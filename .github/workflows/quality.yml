name: Repository Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_registry.py
      - run: python scripts/validate_public_directory.py
      - run: python scripts/validate_intelligence_config.py
      - run: python scripts/validate_growth_config.py
      - run: python scripts/validate_analytics_config.py
      - run: python scripts/validate_seo_config.py
      - run: python -m unittest discover -s tests -v
